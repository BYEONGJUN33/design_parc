<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Banner</title>
<style>
  @font-face { font-family: Pretendard; font-weight: 400; src: url(../fonts/Pretendard-Regular.woff2) format("woff2"); }
  @font-face { font-family: Pretendard; font-weight: 500; src: url(../fonts/Pretendard-Medium.woff2) format("woff2"); }
  @font-face { font-family: Pretendard; font-weight: 700; src: url(../fonts/Pretendard-Bold.woff2) format("woff2"); }
  @font-face { font-family: Pretendard; font-weight: 800; src: url(../fonts/Pretendard-ExtraBold.woff2) format("woff2"); }
  @font-face { font-family: Pretendard; font-weight: 900; src: url(../fonts/Pretendard-Black.woff2) format("woff2"); }

  /* --W / --H are set by render.mjs (mm for PDF, px for PNG preview). */
  :root {
    --W: 5000mm;
    --H: 900mm;
    --u: calc(var(--H) / 100);   /* 1u = 1% of banner height */
  }

  /* Themes: keep backgrounds calm, one accent color only. */
  [data-theme="light"] { --bg: #F7F6F2; --ink: #111418; --sub: #4A4F57; --accent: #1F5EFF; --line: #D9D6CE; }
  [data-theme="navy"]  { --bg: #0F1B33; --ink: #FFFFFF; --sub: #B9C3D6; --accent: #FFC83D; --line: #2A3A5C; }
  [data-theme="green"] { --bg: #F2F5EF; --ink: #10261A; --sub: #46594C; --accent: #1E8A4C; --line: #D3DCCF; }
  [data-theme="red"]   { --bg: #FFFFFF; --ink: #16181C; --sub: #4A4F57; --accent: #E0322B; --line: #E4E4E4; }

  @page { margin: 0; }
  html, body { margin: 0; padding: 0; }
  body {
    width: var(--W);
    height: var(--H);
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: Pretendard, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .banner {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    /* safe margin so nothing important sits near grommets / cut line */
    padding: calc(var(--u) * 9) calc(var(--u) * 16);
    display: flex;
    flex-direction: column;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  [data-align="center"] .main { align-items: center; text-align: center; }
  [data-align="center"] .eyebrow { align-self: center; }

  /* left accent bar */
  .banner::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: calc(var(--u) * 4);
    background: var(--accent);
  }

  .eyebrow {
    display: inline-block;
    align-self: flex-start;
    font-weight: 700;
    font-size: calc(var(--u) * 8);
    letter-spacing: 0.02em;
    color: var(--accent);
    margin-bottom: calc(var(--u) * 3);
  }

  .title {
    font-weight: 900;
    font-size: calc(var(--u) * 34);
    line-height: 1.08;
    letter-spacing: -0.035em;
    margin: 0;
    white-space: nowrap;
  }
  .title em { font-style: normal; color: var(--accent); }

  .subtitle {
    font-weight: 500;
    font-size: calc(var(--u) * 9);
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: var(--sub);
    margin-top: calc(var(--u) * 3);
    white-space: nowrap;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: calc(var(--u) * 0.35) solid var(--line);
    padding-top: calc(var(--u) * 2.5);
    font-size: calc(var(--u) * 6);
    font-weight: 500;
    color: var(--sub);
  }
  .footer .org { font-weight: 800; color: var(--ink); }
  .footer:empty, .eyebrow:empty, .subtitle:empty { display: none; }
</style>
</head>
<body data-theme="light">
  <div class="banner">
    <div class="main">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="title" id="title"></h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="footer" id="footer"><span class="info" id="info"></span><span class="org" id="org"></span></div>
  </div>
</body>
</html>
